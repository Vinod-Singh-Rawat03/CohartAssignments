<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribbble</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <section class="section-1">
            <header>
                <div class="menuDiv">
                    <div class="logo">
                        <img src="/images/logo.png" alt="logo">
                    </div>
                    <div class="menu">
                        <a href="#">Explore<i class="ri-arrow-down-s-line"></i></a>
                        <a href="#">Hire a Designer<i class="ri-arrow-down-s-line"></i></a>
                        <a href="#">Find jobs</a>
                        <a href="#">Blog</a>
                    </div>
                </div>
                <div class="navbuttons">
                    <button class="signUp">Sign up</button>
                    <button class="login">Log in</button>
                </div>
            </header>
            <div class="heroDiv">
                <div class="content">
                    <h1>Discover the world's <br>top designers</h1>
                    <h2>Explore work from the most talented and accomplished designers <br>ready to take on your next project</h2>  
                </div>
                <div class="search-Trending">
                    <div class="search">
                        <div class="searchbar">
                            <input type="text" placeholder="What are you looking for?">
                        </div>
                        <div class="icon-shots">
                            <div class="shots"><span>Shots</span> <i class="ri-arrow-down-s-line"></i></div>
                            <div class="searchicon">
                                <i class="ri-search-line"></i>
                            </div>
                        </div>

                    </div>
                    <div class="trending">
                        <div class="trendingText">Treanding Searches</div>
                        <div class="boxes box1 ">landing page</div>
                        <div class="boxes box2">e-commerse</div>
                        <div class="boxes box3">mobile app </div>
                        <div class="boxes box4">logo design </div>
                        <div class="boxes box5">dashboard </div>
                        <div class="boxes box6">icons </div>
                    </div>
                    
                </div>




            </div>

        </section>
    </main>
</body>

</html>
